services:
  signature-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5050:8080"
    environment:
      - IBANITY_KEY_ID=${IBANITY_KEY_ID}
      - IBANITY_PRIVATE_KEY_PATH=/usr/app/keys/private_key.pem
    volumes:
      - ${IBANITY_PRIVATE_KEY_PATH_LOCAL}:/usr/app/keys/private_key.pem